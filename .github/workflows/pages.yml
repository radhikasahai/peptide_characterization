name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure production API URL
        env:
          API_URL: ${{ vars.PEPTIDE_API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            sed -i "s|__PEPTIDE_API_URL__|${API_URL}|g" docs/js/config.js
          else
            echo "::warning::Set repo variable PEPTIDE_API_URL (Settings → Secrets and variables → Actions → Variables) to your Render API URL."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
