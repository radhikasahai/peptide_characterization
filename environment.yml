name: peptide

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # Core Dependencies
  - rdkit>=2023.09
  - biopython>=1.80
  - pandas>=2.0
  - numpy>=1.24

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12
  - plotly>=5.10
  - pillow>=9.0

  # Web Framework
  - streamlit>=1.25

  # Database
  - sqlalchemy>=2.0

  # Data Export
  - openpyxl>=3.1
  - reportlab>=4.0
  - python-docx>=0.8

  # Testing
  - pytest>=7.0
  - pytest-cov>=4.0
  - pytest-xdist>=3.0
  - pytest-timeout>=2.1

  # Code Quality
  - black>=23.0
  - flake8>=6.0
  - mypy>=1.5
  - isort>=5.12
  - pylint>=3.0

  # Utilities
  - python-dotenv>=1.0
  - pyyaml>=6.0
  - tqdm>=4.65
  - requests>=2.31

  # Documentation
  - sphinx>=7.0
  - sphinx_rtd_theme>=1.3

  # Development
  - ipython>=8.10
  - jupyter>=1.0
  - notebook>=7.0

  # pip
  - pip

  # pip-only packages
  - pip:
      - streamlit-option-menu>=0.3.6
      - fastapi>=0.100
      - httpx>=0.24
      - uvicorn[standard]>=0.23